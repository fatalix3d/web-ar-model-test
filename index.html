<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Skyline Plaza — интерактивная 3D-модель с просмотром в дополненной реальности на iPhone и Android."
    >
    <title>Skyline Plaza — посмотреть в AR</title>
    <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
    <link rel="stylesheet" href="./styles.css">
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
    ></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="experience">
      <section class="viewer-shell" aria-label="3D-модель Skyline Plaza">
        <model-viewer
          id="model-viewer"
          src="./assets/skyline_plaza.glb?v=4"
          environment-image="./assets/modern_buildings_1k.hdr"
          alt="Архитектурная 3D-модель комплекса Skyline Plaza"
          ar
          ar-modes="scene-viewer quick-look webxr"
          ar-placement="floor"
          ar-scale="auto"
          ar-usdz-max-texture-size="2048"
          camera-controls
          touch-action="pan-y"
          auto-rotate
          auto-rotate-delay="1200"
          rotation-per-second="12deg"
          camera-orbit="35deg 67deg auto"
          min-camera-orbit="auto 20deg auto"
          max-camera-orbit="auto 88deg auto"
          shadow-intensity="1.1"
          shadow-softness="0.8"
          exposure="1.05"
          interaction-prompt="none"
        >
          <div class="load-state" slot="poster" aria-hidden="true">Загрузка модели…</div>
          <div class="progress" slot="progress-bar" aria-hidden="true">
            <span id="progress-fill"></span>
          </div>
        </model-viewer>

        <p class="viewer-error" id="viewer-error" role="status" hidden>
          Не удалось загрузить 3D-модель. Обновите страницу.
        </p>
      </section>

      <div class="controls">
        <button class="ar-button" id="ar-button" type="button">Показать в AR</button>
        <p class="instructions">Вращайте модель пальцем. Сведите или разведите пальцы, чтобы изменить масштаб.</p>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </main>
  </body>
</html>
